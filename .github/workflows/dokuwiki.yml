name: DokuWiki Default Tasks
on:
  push:
  pull_request:
  schedule:
    - cron: '22 21 12 * *'


# the shared autofix job opens pull requests with style fixes; new repositories
# default to a read-only token, which makes the whole run fail at startup
permissions:
  contents: write
  pull-requests: write

jobs:
  all:
    uses: dokuwiki/github-action/.github/workflows/all.yml@main
